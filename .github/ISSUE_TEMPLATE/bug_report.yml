name: Bug report
description: Something in the system does not behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill the sections below so we can reproduce it quickly.
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      placeholder: "2.1.87"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - WSL2
        - Other
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Repository commit or tag
      placeholder: "v0.1.0 or ef942a9"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal commands or prompts that reproduce the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste the output of `bash scripts/doctor.sh` and any error messages.
      render: text
