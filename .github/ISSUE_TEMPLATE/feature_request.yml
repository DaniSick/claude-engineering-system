name: Feature request
description: Propose a new agent, skill, hook, or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? Who hits it and how often?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the system do? Which component (agent, skill, hook, doc) owns it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else could solve this? Why is the proposal better?
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: What is explicitly out of scope?
